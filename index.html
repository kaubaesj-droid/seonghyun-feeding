<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성현 키우기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#e9f0f8;--card:#fff;--ink:#14213d;--mu:#5d6b85;--line:#cfd9e8;--coin:#ffb703;--coin2:#fb8500;--ok:#2a9d5c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#19223a;--ink:#f1f4fb;--mu:#98a5c0;--line:#2a3654;--ok:#4cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#19223a;--ink:#f1f4fb;--mu:#98a5c0;--line:#2a3654;--ok:#4cc58a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.top{text-align:center}
.stage{font-size:15px;color:var(--mu);margin:4px 0 0}
.money{font-size:44px;line-height:1.1;margin:4px 0}
.rate{font-size:15px;color:var(--mu);margin:0}
.scene{margin:16px 0 8px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:linear-gradient(#8fd0ff66,transparent),var(--card)}
.town{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 8px;min-height:60px;padding:8px 10px 0;font-size:30px;line-height:1}
.grp{display:flex;align-items:flex-end;gap:1px}
.grp small{font-size:12px;color:var(--ink);font-family:inherit;margin-left:2px}
.bld{display:inline-block;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-30px) scale(.6);opacity:0}}
.walk{height:10px;background:#9aa3b2;border-top:3px solid var(--ink)}
.tapwrap{position:relative;height:120px;background:#3a3f4a;display:flex;justify-content:center;align-items:center;overflow:hidden}
.tapwrap::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#f5d76e 0 28px,transparent 28px 56px)}
#tap{position:relative;width:100%;height:100%;border:none;background:none;font-size:72px;line-height:1;cursor:pointer;transition:transform .06s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#tap:active{transform:scale(.9)}
#tap:focus-visible,.buy:focus-visible,#reset:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#tap:focus-visible{outline-color:#fff;outline-offset:-6px}
#tap svg{pointer-events:none;overflow:visible;display:block;margin:auto}
.acc{display:none}
svg[data-s="1"] .c1,svg[data-s="2"] .c2,svg[data-s="3"] .c3,svg[data-s="4"] .c4{display:inline}
.pop{position:absolute;pointer-events:none;font-size:22px;color:#fff;animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.hint{text-align:center;color:var(--mu);font-size:14px;margin:0 0 18px}
h2{font-size:18px;margin:20px 0 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item .ico{font-size:30px;width:40px;text-align:center}
.item .info{flex:1;min-width:0}
.item .nm{font-size:17px;margin:0}
.item .ds{font-size:13px;color:var(--mu);margin:2px 0 0}
.buy{font-family:inherit;font-size:15px;min-width:92px;padding:9px 10px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation}
.buy.can{background:var(--ok);color:#fff;border-color:var(--ok)}
.buy:disabled{opacity:.55;cursor:not-allowed}
.foot{text-align:center;margin-top:24px}
#reset{font-family:inherit;font-size:13px;background:none;border:none;color:var(--mu);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}.bld{animation:none}#tap{transition:none}}
</style>
</head>

    {n:"마트",i:"🏬",d:"초당 40원",base:3000,r:40},
    {n:"치킨 프랜차이즈",i:"🍗",d:"초당 250원",base:20000,r:250},
    {n:"빌딩 임대업",i:"🏢",d:"초당 1,500원",base:150000,r:1500}
  ];
  var S={money:0,total:0,power:1,jobs:JOBS.map(function(){return 0}),t:Date.now()};
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o.money==="number"){S=o;
    if(!S.jobs||S.jobs.length!==JOBS.length)S.jobs=JOBS.map(function(){return 0});
    var off=Math.min((Date.now()-(S.t||Date.now()))/1000,3600);var g=off*rate();S.money+=g;S.total+=g;}}}catch(e){}
  function rate(){var s=0;for(var i=0;i<JOBS.length;i++)s+=JOBS[i].r*S.jobs[i];return s}
  function powerCost(){return Math.floor(15*Math.pow(1.5,S.power-1))}
  function jobCost(i){return Math.floor(JOBS[i].base*Math.pow(1.15,S.jobs[i]))}
  function fmt(n){n=Math.floor(n);var u=[[1e12,"조"],[1e8,"억"],[1e4,"만"]];
    for(var i=0;i<u.length;i++){if(n>=u[i][0]){var v=n/u[i][0];return (v>=100?Math.floor(v):v.toFixed(1).replace(/\.0$/,""))+u[i][1]+"원"}}
    return n.toLocaleString("ko-KR")+"원"}
  var $=function(id){return document.getElementById(id)};
  function row(ico,nm,ds,id){
    var d=document.createElement("div");d.className="item";
    d.innerHTML='<div class="ico">'+ico+'</div><div class="info"><p class="nm"></p><p class="ds"></p></div><button class="buy" id="'+id+'"></button>';
    d.querySelector(".nm").textContent=nm;d.querySelector(".ds").textContent=ds;return d}
  var pw=row("💪","성현 파워","","bp");$("power").appendChild(pw);
  JOBS.forEach(function(j,i){$("jobs").appendChild(row(j.i,j.n,j.d,"bj"+i))});
  $("bp").onclick=function(){var c=powerCost();if(S.money>=c){S.money-=c;S.power++;draw()}};
  JOBS.forEach(function(j,i){$("bj"+i).onclick=function(){var c=jobCost(i);if(S.money>=c){S.money-=c;S.jobs[i]++;draw()}}});
  $("tap").addEventListener("click",function(e){
    S.money+=S.power;S.total+=S.power;
    var p=document.createElement("span");p.className="pop";p.textContent="+"+S.power;
    p.style.left=(40+Math.random()*60)+"%";p.style.top="20%";$("tap").parentNode.appendChild(p);
    setTimeout(function(){p.remove()},800);draw()});
  $("reset").onclick=function(){if(confirm("모든 진행 상황이 사라져요. 처음부터 다시 할까요?")){
    S={money:0,total:0,power:1,jobs:JOBS.map(function(){return 0}),t:Date.now()};save();draw()}};
  function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var grps=[];
  function drawTown(){var t=$("town");
    JOBS.forEach(function(j,i){
      if(!grps[i]){var g0=document.createElement("span");g0.className="grp";g0.setAttribute("aria-label",j.n);t.appendChild(g0);grps[i]=g0}
      var g=grps[i],n=Math.min(S.jobs[i],3),sm=g.querySelector("small"),bl=g.querySelectorAll(".bld"),c=bl.length;
      while(c<n){var b=document.createElement("span");b.className="bld";b.textContent=j.i;g.insertBefore(b,sm);c++}
      while(c>n){g.removeChild(bl[c-1]);c--}
      if(S.jobs[i]>3){if(!sm){sm=document.createElement("small");g.appendChild(sm)}sm.textContent="×"+S.jobs[i]}else if(sm){g.removeChild(sm)}
    })}
  function draw(){
    $("money").textContent=fmt(S.money);
    $("rate").textContent="초당 "+fmt(rate())+" · 한 번 누를 때 "+fmt(S.power);
    var st=STAGES[0];for(var i=0;i<STAGES.length;i++)if(S.total>=STAGES[i][0])st=STAGES[i];
    var si=STAGES.indexOf(st),cv=$("tap").firstChild;if(cv.getAttribute("data-s")!=si){cv.setAttribute("data-s",si);cv.style.setProperty("--shirt",SHIRTS[si])}$("stage").textContent=st[2];drawTown();
    var b=$("bp");b.textContent=fmt(powerCost());b.disabled=S.money<powerCost();b.className="buy"+(b.disabled?"":" can");
    pw.querySelector(".ds").textContent="Lv."+S.power+" · 누를 때마다 +"+S.power+"원";
    JOBS.forEach(function(j,i){var bb=$("bj"+i),c=jobCost(i);bb.textContent=fmt(c);bb.disabled=S.money<c;bb.className="buy"+(bb.disabled?"":" can");
      bb.parentNode.querySelector(".ds").textContent=j.d+" · 보유 "+S.jobs[i]+"개"})}
  var last=Date.now();
  setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;var g=rate()*dt;S.money+=g;S.total+=g;draw()},250);
  setInterval(save,5000);
  window.addEventListener("beforeunload",save);
  draw();
})();
</script>
</body>
</html>
